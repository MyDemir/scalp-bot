# fly.toml app configuration file generated for scalp-bot on 2026-10-17T09:20:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scalp-bot'
primary_region = 'fra'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  # V8 varsayılanı makine belleğinin ~1/4'ü (512 MB'ta ~128 MB eski nesil) — bot + haftalık rapor buna sığmıyordu.
  # 512 MB makinede 320 MB heap + yerel bellek (SQLite, canvas, tamponlar) sığar; bellek değişirse bunu da güncelle.
  NODE_OPTIONS = '--max-old-space-size=320'

[processes]
  app = 'node src/server.js'

[[mounts]]
  source = 'scalp_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
