# ── Scalp Sinyal Motoru — Fly.io yapılandırması ─────────────────────────────
#
# ÖNEMLİ: 'app' adı global olarak benzersiz olmalı — deploy etmeden önce
# değiştir (örn: "scalp-bot-mydemir").
#
# ÖNEMLİ: primary_region mutlaka fra veya ams olmalı — Binance Futures API
# ABD IP'lerini (iad, ord, sea, dfw vb.) 451 hatasıyla engelliyor.
#
# Web paneli port 3000 üzerinden yayınlanır.
# auto_stop_machines = false ayarı sayesinde arka plan WebSocket ve Telegram
# bağlantıları web trafiği olmasa dahi ASLA uyutulmaz, kesintisiz çalışır.

app = "scalp-bot-vip"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Kalıcı disk — SQLite veritabanı burada yaşıyor.
# Bu olmadan her deploy/restart'ta sinyal geçmişi silinir.
[mounts]
  source      = "scalp_data"
  destination = "/data"

# 512 MB: 256 MB'den biraz pahalıdır ancak Node.js botu + web paneli için
# bellek tükenmesi (OOM) riskini azaltan en düşük pratik seçimdir.
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

# Web Paneli için HTTP servisi — Fly.io otomatik https://<app>.fly.dev alan adına yönlendirir
[http_service]
  internal_port = 3000
  processes = ["app"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[processes]
  app = "node src/server.js"
